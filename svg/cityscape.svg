<svg viewBox="0 0 1200 250" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .city-beacons line { stroke: #00f3ff; stroke-width: 1.5; }
      .city-beacons circle { fill: #ff2a85; }
      .city-silhouette { fill: #080010; stroke: #ff2a85; stroke-width: 1; stroke-linejoin: round; filter: drop-shadow(0 0 6px rgba(255, 42, 133, 0.45)); }
      .city-windows-cyan { fill: #00f3ff; opacity: 0.85; filter: drop-shadow(0 0 3px #00f3ff); }
      .city-windows-yellow { fill: #ffe600; opacity: 0.75; filter: drop-shadow(0 0 3px #ffe600); }
      .sign-truss { stroke: rgba(0, 243, 255, 0.45); stroke-width: 1.2; stroke-dasharray: 2 2; }
      .billboard-plate { fill: #0c0017; stroke: #ff2a85; stroke-width: 1.5; filter: drop-shadow(0 0 8px rgba(255, 42, 133, 0.4)); }
      .sign-kana-pink { font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-size: 15px; fill: #fff; letter-spacing: 0.15em; filter: drop-shadow(0 0 3px #fff) drop-shadow(0 0 8px #ff2a85) drop-shadow(0 0 16px #ff2a85); }
      .sign-kana-cyan { font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-size: 13px; fill: #e0ffff; letter-spacing: 0.12em; filter: drop-shadow(0 0 3px #fff) drop-shadow(0 0 7px #00f3ff) drop-shadow(0 0 15px #00f3ff); }
      .sign-vhs-text { font-family: 'Orbitron', sans-serif; font-weight: 900; font-style: italic; font-size: 13px; letter-spacing: 0.18em; fill: #ffe600; filter: drop-shadow(0 0 3px #fff) drop-shadow(0 0 8px #ffe600) drop-shadow(0 0 15px #ff5e00); }
    </style>
  </defs>
  <g class="city-beacons">
    <line x1="140" y1="30" x2="140" y2="70" />
    <circle cx="140" cy="30" r="3" />
    <line x1="520" y1="15" x2="520" y2="55" />
    <circle cx="520" cy="15" r="3.5" />
    <line x1="880" y1="25" x2="880" y2="65" />
    <circle cx="880" cy="25" r="3" />
  </g>
  <g class="city-silhouette">
    <polygon points="40,250 40,160 70,140 100,160 100,250" />
    <rect x="110" y="70" width="60" height="180" />
    <polygon points="180,250 180,150 230,150 230,250" />
    <polygon points="250,250 250,175 310,135 310,250" />
    <rect x="330" y="155" width="50" height="95" />
    <rect x="390" y="85" width="70" height="165" />
    <polygon points="480,250 480,115 510,55 530,55 560,115 560,250" />
    <rect x="580" y="140" width="55" height="110" />
    <polygon points="650,250 650,165 710,130 710,250" />
    <rect x="730" y="150" width="45" height="100" />
    <polygon points="790,250 790,140 820,120 850,140 850,250" />
    <rect x="860" y="65" width="50" height="185" />
    <polygon points="930,250 930,155 980,125 980,250" />
    <rect x="1000" y="145" width="40" height="105" />
    <rect x="1045" y="90" width="45" height="160" />
  </g>
  <g class="city-windows-cyan">
    <rect x="125" y="90" width="6" height="5" />
    <rect x="145" y="90" width="6" height="5" />
    <rect x="125" y="110" width="6" height="5" />
    <rect x="145" y="130" width="6" height="5" />
    <rect x="405" y="110" width="7" height="5" />
    <rect x="435" y="130" width="7" height="5" />
    <rect x="505" y="125" width="7" height="6" />
    <rect x="525" y="145" width="7" height="6" />
    <rect x="872" y="95" width="6" height="5" />
    <rect x="890" y="115" width="6" height="5" />
  </g>
  <g class="city-windows-yellow">
    <rect x="135" y="100" width="6" height="5" />
    <rect x="420" y="100" width="7" height="5" />
    <rect x="515" y="135" width="7" height="6" />
    <rect x="882" y="85" width="6" height="5" />
    <rect x="1055" y="115" width="6" height="5" />
  </g>
  <g class="city-signs">
    <line x1="265" y1="160" x2="265" y2="175" class="sign-truss" />
    <line x1="295" y1="160" x2="295" y2="175" class="sign-truss" />
    <text x="250" y="155" class="sign-kana-pink">サイバー</text>
    <line x1="398" y1="72" x2="408" y2="85" class="sign-truss" />
    <line x1="442" y1="72" x2="432" y2="85" class="sign-truss" />
    <rect x="390" y="52" width="60" height="22" rx="3" class="billboard-plate" />
    <text x="420" y="68" text-anchor="middle" class="sign-vhs-text">VHS</text>
    <line x1="740" y1="138" x2="740" y2="150" class="sign-truss" />
    <line x1="765" y1="138" x2="765" y2="150" class="sign-truss" />
    <text x="732" y="134" class="sign-kana-cyan">ネオン</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <defs>
    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-pink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-yellow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="fuselageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b0830" />
      <stop offset="100%" stop-color="#0c0017" />
    </linearGradient>

    <linearGradient id="windshieldGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="rgba(0, 243, 255, 0.7)" />
      <stop offset="40%" stop-color="rgba(0, 243, 255, 0.25)" />
      <stop offset="100%" stop-color="rgba(12, 0, 23, 0.6)" />
    </linearGradient>

    <linearGradient id="mainRotorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="20%" stop-color="#00f3ff" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="80%" stop-color="#00f3ff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>

    <linearGradient id="tailRotorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="25%" stop-color="#00f3ff" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="75%" stop-color="#00f3ff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>

    <linearGradient id="spotlightGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 243, 255, 0.75)" />
      <stop offset="40%" stop-color="rgba(0, 243, 255, 0.25)" />
      <stop offset="100%" stop-color="rgba(0, 243, 255, 0)" />
    </linearGradient>
  </defs>

  <style>
    /* Searchlight sweep */
    .spotlight {
      transform-origin: 205px 125px;
      animation: sweep 4s ease-in-out infinite alternate;
    }
    @keyframes sweep {
      0% { transform: rotate(-14deg); opacity: 0.5; }
      50% { transform: rotate(4deg); opacity: 0.85; }
      100% { transform: rotate(18deg); opacity: 0.55; }
    }

    /* Main rotor blurred spin */
    .rotor-main {
      transform-origin: 180px 48px;
      animation: spin-main 0.1s linear infinite;
    }
    @keyframes spin-main {
      0% { transform: scaleX(1); opacity: 0.9; }
      50% { transform: scaleX(0.25); opacity: 0.45; }
      100% { transform: scaleX(1); opacity: 0.9; }
    }

    /* Tail rotor spin */
    .rotor-tail {
      transform-origin: 33px 62px;
      animation: spin-tail 0.08s linear infinite;
    }
    @keyframes spin-tail {
      0% { transform: scaleY(1); opacity: 0.9; }
      50% { transform: scaleY(0.2); opacity: 0.4; }
      100% { transform: scaleY(1); opacity: 0.9; }
    }

    /* Navigation beacon pulse */
    .beacon {
      animation: beacon-blink 0.8s steps(2, start) infinite;
    }
    @keyframes beacon-blink {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }

    /* Subtle hover vibration */
    .heli-group {
      animation: heli-float 1.8s ease-in-out infinite alternate;
    }
    @keyframes heli-float {
      0% { transform: translateY(0px) rotate(1deg); }
      100% { transform: translateY(-4px) rotate(-1deg); }
    }
  </style>

  <!-- Downward Searchlight Beam -->
  <polygon class="spotlight" points="203,125 207,125 285,215 130,215" fill="url(#spotlightGrad)" />

  <g class="heli-group">
    <!-- Landing Skids -->
    <!-- Front Strut -->
    <line x1="195" y1="118" x2="208" y2="136" stroke="#00f3ff" stroke-width="3" stroke-linecap="round" filter="url(#glow-cyan)" />
    <!-- Rear Strut -->
    <line x1="152" y1="118" x2="140" y2="136" stroke="#00f3ff" stroke-width="3" stroke-linecap="round" filter="url(#glow-cyan)" />
    <!-- Skid Tube -->
    <path d="M 120 136 L 222 136 C 228 136 234 133 236 127" fill="none" stroke="#ff2a85" stroke-width="3.5" stroke-linecap="round" filter="url(#glow-pink)" />

    <!-- Tail Section -->
    <!-- Tail Boom -->
    <polygon points="50,75 140,84 140,94 50,81" fill="url(#fuselageGrad)" stroke="#ff2a85" stroke-width="1.8" filter="url(#glow-pink)" />
    <!-- Tail Accent Stripe -->
    <line x1="60" y1="78" x2="135" y2="88" stroke="#00f3ff" stroke-width="1.5" stroke-dasharray="6 3" />
    <!-- Vertical Fin -->
    <polygon points="40,50 54,50 46,85 34,85" fill="#0c0017" stroke="#00f3ff" stroke-width="2" filter="url(#glow-cyan)" />
    <!-- Horizontal Stabilizer -->
    <line x1="56" y1="78" x2="74" y2="78" stroke="#ff2a85" stroke-width="2.5" stroke-linecap="round" />

    <!-- Tail Rotor Blades -->
    <g class="rotor-tail">
      <ellipse cx="33" cy="62" rx="3.5" ry="24" fill="url(#tailRotorGrad)" filter="url(#glow-cyan)" />
      <circle cx="33" cy="62" r="3" fill="#00f3ff" />
    </g>

    <!-- Main Fuselage Body -->
    <path d="M 132 82 
             C 132 66, 175 60, 210 66 
             C 234 70, 245 88, 242 104 
             C 238 120, 208 124, 168 124 
             C 142 124, 132 110, 132 82 Z"
          fill="url(#fuselageGrad)" 
          stroke="#ff2a85" 
          stroke-width="2.2" 
          stroke-linejoin="round"
          filter="url(#glow-pink)" />

    <!-- Body Trim Line -->
    <path d="M 142 98 Q 185 106 236 94" fill="none" stroke="#00f3ff" stroke-width="1.5" opacity="0.8" />

    <!-- Cockpit Windshield -->
    <path d="M 194 67 
             C 214 69, 230 78, 237 92 
             L 214 96 
             C 200 96, 192 84, 194 67 Z" 
          fill="url(#windshieldGrad)" 
          stroke="#00f3ff" 
          stroke-width="2" 
          stroke-linejoin="round"
          filter="url(#glow-cyan)" />

    <!-- Rotor Mast & Hub -->
    <rect x="177" y="47" width="6" height="15" rx="1.5" fill="#00f3ff" filter="url(#glow-cyan)" />
    <ellipse cx="180" cy="48" rx="8" ry="2.5" fill="#120524" stroke="#ff2a85" stroke-width="1.5" />

    <!-- Main Rotor Blades -->
    <g class="rotor-main">
      <ellipse cx="180" cy="47" rx="110" ry="3.5" fill="url(#mainRotorGrad)" filter="url(#glow-cyan)" />
      <!-- Hub Center Glow -->
      <circle cx="180" cy="47" r="3.5" fill="#ffffff" filter="url(#glow-yellow)" />
    </g>

    <!-- Navigation Beacon -->
    <circle class="beacon" cx="172" cy="62" r="3.5" fill="#ffe600" filter="url(#glow-yellow)" />
    
    <!-- Nose Searchlight Fixture -->
    <circle cx="205" cy="123" r="4.5" fill="#0c0017" stroke="#00f3ff" stroke-width="1.5" />
    <circle cx="205" cy="123" r="2.5" fill="#ffffff" filter="url(#glow-cyan)" />
  </g>
</svg>
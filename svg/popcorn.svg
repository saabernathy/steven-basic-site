<svg viewBox="0 0 120 130" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#00f3ff" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ff2a85" flood-opacity="0.7" />
    </filter>
    <clipPath id="bucket-clip">
      <polygon points="28,42 92,42 84,120 36,120" />
    </clipPath>
    <style>
      .kernels circle { fill: #ffe600; stroke: #ff5e00; stroke-width: 1.5; filter: drop-shadow(0 0 5px rgba(255, 230, 0, 0.8)); }
      .bucket-body { fill: #0c0017; stroke: #00f3ff; stroke-width: 2; }
      .bucket-stripes rect { fill: #ff2a85; opacity: 0.85; }
      .bucket-rim { fill: #1a0b2c; stroke: #00f3ff; stroke-width: 2.2; }
      .bucket-label-plate { fill: #0c0017; stroke: #00f3ff; stroke-width: 1.5; }
      .bucket-label-text { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 11px; fill: #fff; letter-spacing: 0.12em; filter: drop-shadow(0 0 4px #00f3ff); }
    </style>
  </defs>
  <g class="kernels">
    <circle cx="42" cy="38" r="9" />
    <circle cx="56" cy="30" r="11" />
    <circle cx="72" cy="33" r="10" />
    <circle cx="82" cy="40" r="8" />
    <circle cx="48" cy="22" r="8" />
    <circle cx="64" cy="20" r="9" />
    <circle cx="34" cy="42" r="7" />
  </g>
  <g filter="url(#neon-glow)">
    <polygon points="28,42 92,42 84,120 36,120" class="bucket-body" />
    <g clip-path="url(#bucket-clip)" class="bucket-stripes">
      <rect x="25" y="42" width="10" height="85" />
      <rect x="45" y="42" width="10" height="85" />
      <rect x="65" y="42" width="10" height="85" />
      <rect x="85" y="42" width="10" height="85" />
    </g>
    <ellipse cx="60" cy="42" rx="34" ry="5" class="bucket-rim" />
    <rect x="44" y="68" width="32" height="20" rx="3" class="bucket-label-plate" />
    <text x="60" y="82" text-anchor="middle" class="bucket-label-text">VHS</text>
  </g>
</svg>